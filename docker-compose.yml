version: "3.9"

services:
  app:
    image: node:20-alpine
    container_name: dev-portfolio
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    command: sh -c "npm install && npm run dev"

  terminal-server:
    build: ./terminal-server
    ports:
      - "4000:4000"
    volumes:
      - ./k8s/visitor-kubeconfig.yaml:/kubeconfig:ro
    environment:
      - HOST=0.0.0.0
      - PORT=4000
      - KUBECONFIG=/kubeconfig
      - MAX_SESSIONS=5
      - SESSION_TIMEOUT_MINUTES=10
      - ALLOWED_ORIGINS=http://localhost:3000
    restart: unless-stopped
