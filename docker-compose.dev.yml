version: "3.9"

services:
  app:
    image: node:20-alpine
    container_name: dev-portfolio
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    command: sh -c "npm install && npm run dev"

  terminal-server:
    build: ./terminal-server
    ports:
      - "4000:4000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./k8s/visitor-kubeconfig.yaml:/kubeconfig:ro
    environment:
      - KUBECONFIG_PATH=/kubeconfig
      - MAX_SESSIONS=5
      - SESSION_TIMEOUT_MINUTES=10
    restart: unless-stopped