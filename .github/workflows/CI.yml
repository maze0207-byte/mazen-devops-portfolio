name: CI Pipeline

on:
    push:
        branches: ["**"]
    pull_request:
        branches: [main]
jobs:
    # jobs 1 :Line +type check
    line_and_type_check:
        name: Line & type check
        runs-on: ubuntu-latest

        steps: 
            - name: checkout code 
              uses: actions/checkout@v4

            - name: setup pnpm 
              uses: pnpm/actions-setup@v2
              with:
                version: 9
            
            - name: setup node.js
              uses: actions/setup-node@v4
              with:
                node-version: 20
            
            - name: install dependencies
              run: pnpm install --frozen-lockfile 
              
            - name: Run Typescript check
              run: pnpm tsc --noEmit

            - name: Run ESLint check
              run: pnpm eslint 

    # jobs 2 : Build Next.js
    build:
        name: Build
        runs-on: ubuntu-latest
        needs: line_and_type_check

        steps:
            - name: Checkout code 
              uses: actions/checkout@v4
                
            - name: setup pnpm 
              uses: pnpm/actions-setup@v3
              with:
                 version: 9  

            - name: setup node.js
              uses: actions/setup-node@v4
              with:
                node-version: 20

            - name: Install dependencies
              run: pnpm install --frozen-lockfile
                
            - name: Build Next.js
              run: pnpm build
              env:
                NEXT_PUBLIC_WS_URL:  ws://localhost:3000  # dummy for build check
    # Job 3: Docker Build Test (no push)
    docker-build-test:
        name: Docker Build Test
        runs-on: ubuntu-latest
        needs: build

        steps:
            - name: Checkout code 
              uses: actions/checkout@v4
              
            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Build docker image 
              uses: docker/build-push-action@v3
              with:
                context: .
                file: ./Dockerfile
                push: false     
                tags: mazen-devops-portfolio:test 
                cache-from: type=gha
                cache-to: type=gha,mode=max

         



                    

        

 