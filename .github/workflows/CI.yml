name: CI


on:
  push:
    branches: ["fix-next-command", "main"]
  pull_request:
    branches: [main]

# Global securty permissions for the workflow
permissions:
   contents: read # For checkout action

jobs:
  # ─────────────────────────────────────────
  # Job 1: Lint + Type Check
  # ─────────────────────────────────────────
  lint-and-type-check :
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run TypeScript check
        run: pnpm tsc --noEmit

      - name: Run ESLint
        run: pnpm lint
    
  # dependency vulnerability check (optional but recommended)
      - name: Check for vulnerable dependencies
        run: pnpm audit --audit-level=low
  # ─────────────────────────────────────────
  # Job 2: Build (Next.js)
  # ─────────────────────────────────────────
  build:
    name: Next.js Build
    runs-on: ubuntu-latest
    needs: lint-and-type-check

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Next.js app
        run: pnpm build
        env:
          NEXT_PUBLIC_TERMINAL_WS_PORT: "30500"

  # ─────────────────────────────────────────
  # Job 3: Docker Build Test (no push)
  # ─────────────────────────────────────────
  docker-build-test:
    name: Docker Build Test
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4


      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

    # secret scan for Docker Hub credentials (optional but recommended)
      - name: Check for Docker Hub credentials in code
        uses: gitleaks/gitleaks-action@v2
        with:
          args: "--path . --report-format json --report-path gitleaks_report.json --redact"

      - name: Build Docker image 
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false # do not push to registry
          load: true # load image into runner for testing
          tags: ${{ vars.DOCKERHUB_USERNAME }}/mazen-devops-portfolio:${{github.sha}}
          cache-from: type=gha
          cache-to: type=gha,mode=max
    # vulnerability scan for built Docker image (optional but recommended)
      - name: Scan image 
        uses: aquasecurity/trivy-action@v0.24.0
        with:
          image-ref: ${{ vars.DOCKERHUB_USERNAME }}/mazen-devops-portfolio:${{github.sha}}
          format: 'table'
          exit-code: '0' # fail if vulnerabilities are found
          severity: 'HIGH,CRITICAL' # only report high and critical vulnerabilities
  
  # ─────────────────────────────────────────
  # Job 4: Docker Push  (only main)))
  # ─────────────────────────────────────────

  docker-push:
    runs-on: ubuntu-latest
    needs: docker-build-test
    if: github.ref == 'refs/heads/fix-next-command' # Only run on main branch
    steps:
      -
        name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1 # Fetch full history for accurate git info in Docker buildgit 
      -
        name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      -
        name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/mazen-devops-portfolio:latest
            ${{ vars.DOCKERHUB_USERNAME }}/mazen-devops-portfolio:${{github.sha}}
  # ─────────────────────────────────────────
  # Job 5: update Kubernetes Deployment (only main)
  # ─────────────────────────────────────────
  update-k8s-deployment:
    runs-on: ubuntu-latest
    needs: docker-push
    steps:
      - name: Clone Kubernetes repo
        run: |
          git clone https://x-access-token:${{ secrets.GH_TOKEN }}@github.com/maze0207-byte/portfolio-k8s.git
          cd portfolio-k8s
          git checkout main
      - name: update image tag in Deployment.yaml
        run: |
          cd portfolio-k8s
          sed -i "s#image: .*#image: ${{ vars.DOCKERHUB_USERNAME}}/mazen-devops-portfolio:${{github.sha}}#g" Deployment.yaml
      - name: commit and push changes
        run: |
          cd portfolio-k8s

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add .

          git commit -m "Update image tag to ${{github.sha}} " || echo "No changes to commit"

          git push -u origin main








