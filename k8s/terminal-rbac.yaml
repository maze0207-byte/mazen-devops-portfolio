---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: terminal-visitor
  namespace: portfolio
automountServiceAccountToken: false
---
# Read-only cluster access for kubectl inside the sandbox shell.
# Bind to a dedicated user; generate kubeconfig secret separately.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: terminal-visitor-readonly
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "services", "namespaces", "nodes", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch"]
  - nonResourceURLs: ["/version", "/healthz", "/readyz", "/livez"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: terminal-visitor-readonly
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: terminal-visitor-readonly
subjects:
  - kind: ServiceAccount
    name: terminal-visitor
    namespace: portfolio
