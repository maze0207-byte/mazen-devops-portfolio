apiVersion: v1
kind: ServiceAccount
metadata:
  name: terminal-visitor
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: terminal-visitor-role
rules:
  - apiGroups: [""]
    resources: [pods, services, nodes, namespaces, configmaps, persistentvolumes, persistentvolumeclaims, events]
    verbs: [get, list, watch]
  - apiGroups: ["apps"]
    resources: [deployments, replicasets, statefulsets, daemonsets]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: terminal-visitor-binding
subjects:
  - kind: ServiceAccount
    name: terminal-visitor
    namespace: default
roleRef:
  kind: ClusterRole
  name: terminal-visitor-role
  apiGroup: rbac.authorization.k8s.io

# Create a kubeconfig secret and mount it into the terminal-server container.
# Example, replace the base64 value with your actual kubeconfig content:
# apiVersion: v1
# kind: Secret
# metadata:
#   name: terminal-visitor-kubeconfig
#   namespace: default
# type: Opaque
# data:
#   kubeconfig: <BASE64_ENCODED_KUBECONFIG>
