apiVersion: apps/v1
kind: Deployment
metadata:
  name: terminal-backend
  namespace: portfolio
  labels:
    app: terminal-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: terminal-backend
  template:
    metadata:
      labels:
        app: terminal-backend
    spec:
      serviceAccountName: terminal-backend
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: terminal-backend
          image: YOUR_DOCKERHUB_USERNAME/terminal-backend:latest
          imagePullPolicy: Always
          ports:
            - name: ws
              containerPort: 30500
          env:
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "30500"
            - name: MAX_SESSIONS
              value: "10"
            - name: SESSION_TIMEOUT_MINUTES
              value: "15"
            - name: ALLOWED_NAMESPACES
              value: "portfolio,default"
            - name: DEFAULT_NAMESPACE
              value: "portfolio"
            # Comma-separated browser origins (NodePort frontend on 30000)
            - name: ALLOWED_ORIGINS
              value: "http://YOUR_NODE_IP:30000"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1001
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /healthz
              port: ws
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: ws
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
